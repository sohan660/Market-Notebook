name: Validate website

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Static site checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate HTML, scripts and links
        run: node scripts/validate-site.mjs

  browser:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - name: Find Chrome on GitHub runner
        run: |
          for binary in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$binary" >/dev/null 2>&1; then
              echo "CHROME_BIN=$(command -v "$binary")" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "No Chrome-compatible browser found on this runner"
          exit 1
      - name: Test mobile navigation, quiz, notes, CSV and seven layouts
        run: node scripts/browser-smoke.mjs
